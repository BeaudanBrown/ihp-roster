# App-owned dead-code gate. Main.main is the runtime root; IHP route/controller
# instances are reached through the mounted FrontController graph.
roots = ["Main.main", "Test.HspecMain.main", "^Paths_.*"]
type-class-roots = true
root-instances = [{ class = "\\.IsString$" }, { class = "\\.IsList$" }]
# Marker/type aliases are reflected or exercised by compile-fail fixtures; the
# actionable gate is unreachable app-owned value declarations.
unused-types = false
# Resource and Live generators deliberately emit every registry-owned constructor
# and matcher. Root only those private declaration-complete categories; curated
# facades, handwritten modules, and generated Action/Intent APIs remain subject
# to normal executable/test reachability.
root-modules = [
    "^Application\\.Helper\\.FrontendContract\\.Surface\\.[^.]+\\.Generated\\.Resource$",
    "^Application\\.Helper\\.FrontendContract\\.Surface\\.[^.]+\\.Generated\\.Live$",
]
